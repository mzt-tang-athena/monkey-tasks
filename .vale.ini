StylesPath = .vale/styles

MinAlertLevel = suggestion

[*.md]
# Readability: keep only the document-level LIX score (rule 2: short
# sentences); the other seven scores overlap it, and Polysyllables only
# flags brand words we keep anyway.
BasedOnStyles = MyRules, write-good, Readability
Readability.AutomatedReadability = NO
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.FleschReadingEase = NO
Readability.GunningFog = NO
Readability.SMOG = NO
Readability.Polysyllables = NO
# E-Prime bans every use of "is"; we need copulas in plain statements.
write-good.E-Prime = NO

# The sample vault notes are test fixtures. Their text is data the
# parser tests read, so a rewording would change the tests.
[app/src/lib/vault/sample/**/*.md]
BasedOnStyles =
