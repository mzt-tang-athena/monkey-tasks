name: android

# Builds a sideloadable APK on a GitHub runner, which already has the
# Android SDK and NDK. The release build signs with the debug key that
# prebuild generates, which is enough to install by hand on a phone.
#
# It runs only on demand. A build takes 19 to 45 minutes, and a push to
# main rarely needs a new APK.

on:
  workflow_dispatch:
    inputs:
      dev:
        description: Build a development client APK instead of release
        type: boolean
        default: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out the contracts submodule
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
        run: |
          if [ -n "$CONTRACTS_TOKEN" ]; then
            git config --global url."https://x-access-token:${CONTRACTS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
          git submodule update --init --recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix app
      - name: Generate the native project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      # Caches the Gradle distribution, the dependency cache and the
      # build cache, which turns a 45 minute cold build into a few
      # minutes after the first run.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build the APK
        working-directory: app/android
        env:
          DEV: ${{ inputs.dev }}
        # A debug build carries four ABIs and overruns the runner disk.
        # The dev client only needs the phone's ABI, so arm64 alone.
        run: |
          if [ "$DEV" = "true" ]; then
            ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi
      - name: Name the artifact
        env:
          DEV: ${{ inputs.dev }}
        run: |
          mkdir -p dist
          if [ "$DEV" = "true" ]; then
            cp app/android/app/build/outputs/apk/debug/app-debug.apk "dist/monkey-tasks-dev-${GITHUB_SHA::7}.apk"
          else
            cp app/android/app/build/outputs/apk/release/app-release.apk "dist/monkey-tasks-${GITHUB_SHA::7}.apk"
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.dev && 'monkey-tasks-dev-apk' || 'monkey-tasks-apk' }}
          path: dist/*.apk
          if-no-files-found: error
