name: ci
# A pull request runs once, on its pull_request event. Pushes run only
# on main and on integration branches, so each squash merge into an
# epic branch still gets a run.
on:
  push:
    branches: [main, "epic/**"]
  pull_request: {}

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Check record names
        run: scripts/check-records.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # The docs job needs the shared Vale rules package from GitHub Packages.
      - name: Authenticate to GitHub Packages
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install root dependencies
        run: npm ci
      - name: Install vale
        run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.24.0/vale_3.24.0_Linux_64-bit.tar.gz -o vale.tgz
          tar -xzf vale.tgz vale
          install -m 0755 vale /usr/local/bin/vale
          vale --version
      - name: Fetch write-good styles
        run: |
          git clone -q --depth=1 https://github.com/errata-ai/write-good .vale/styles/write-good
          cd .vale/styles/write-good
          if [ -d write-good ]; then mv write-good/* .; rmdir write-good; fi
          find . -maxdepth 1 -name '*.yml' | while read f; do grep -q extends "$f" || rm "$f"; done
      - name: Sync shared Vale rules
        run: npx vale-rules sync
      - name: Docs prose lint
        run: |
          # Vale exits zero on warnings, so the step fails on any output.
          # A nonzero exit with no output means Vale itself failed, for
          # example on a path it cannot read, so that fails the step too.
          # Some note names hold spaces, so the list is NUL separated.
          vale_exit=0
          alerts=$(git ls-files -z '*.md' | xargs -0 vale --minAlertLevel=warning --output=line) || vale_exit=$?
          if [ -n "$alerts" ]; then
            echo "$alerts"
            exit 1
          fi
          if [ "$vale_exit" -ne 0 ]; then
            echo "::error::vale exited with $vale_exit and printed no alerts. Its error is above."
            exit 1
          fi

  code:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The schemas package lives in the contracts submodule. The
          # submodule is checked out by the next step, which can use a
          # token: GITHUB_TOKEN is scoped to this repository only, so it
          # cannot read a private sibling repository.
          submodules: false
      - name: Check out the contracts submodule
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
        run: |
          if [ -n "$CONTRACTS_TOKEN" ]; then
            git config --global url."https://x-access-token:${CONTRACTS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
          if ! git submodule update --init --recursive; then
            echo "::error::Cannot check out the contracts submodule. Add a CONTRACTS_TOKEN secret with read access to mzt-tang-athena/contracts, or make that repository public."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      # Root install brings in the file: schemas dependency (and its vitest) used by the schemas tests.
      - name: Authenticate to GitHub Packages
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install root dependencies
        run: npm ci
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      - name: Typecheck app
        run: npx tsc --noEmit
        working-directory: app
      - name: Lint app
        run: npx eslint src scripts e2e --max-warnings 0
        working-directory: app
      - name: Test app
        run: npx vitest run
        working-directory: app
      - name: Test schemas
        run: npm test
        working-directory: contracts/packages/schemas
      # Runs last so type and test failures stop the job before the slower bundle build.
      - name: Bundle app with Metro
        run: npx expo export --platform android --output-dir /tmp/bundle
        working-directory: app

  # Playwright drives the exported web build through the sample set
  # (ADR 0038, ticket 0049). The steps up to the app install match the
  # code job.
  e2e-web:
    runs-on: ubuntu-latest
    # Two projects of about 220 tests each take 8 to 10 minutes with the
    # install and the export. The old 10 minute limit cancelled a run
    # one second after its last test passed.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out the contracts submodule
        env:
          CONTRACTS_TOKEN: ${{ secrets.CONTRACTS_TOKEN }}
        run: |
          if [ -n "$CONTRACTS_TOKEN" ]; then
            git config --global url."https://x-access-token:${CONTRACTS_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
          if ! git submodule update --init --recursive; then
            echo "::error::Cannot check out the contracts submodule. Add a CONTRACTS_TOKEN secret with read access to mzt-tang-athena/contracts, or make that repository public."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Authenticate to GitHub Packages
        run: npm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install root dependencies
        run: npm ci
      - name: Install app dependencies
        run: npm ci
        working-directory: app
      # The key follows the lock file, so a Playwright bump fetches the
      # browser build that matches it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: app
      # The script turns the memory vault's test hooks on (ADR 0037).
      - name: Export the web build
        run: npm run web:export
        working-directory: app
      - name: Run Playwright
        run: npx playwright test -c e2e/playwright.config.ts
        working-directory: app
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/e2e/playwright-report
          retention-days: 7
